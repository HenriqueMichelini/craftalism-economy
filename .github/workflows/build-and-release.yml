name: Build and Release Plugin

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

jobs:
  verify-release-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: java

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build with Gradle
        run: ./gradlew --no-daemon clean build

      - name: Upload verified plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-plugin-jar
          path: java/build/libs/*.jar
          retention-days: 7

  release:
    needs: verify-release-commit
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to create releases

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: verified-plugin-jar
          path: verified-plugin

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p release
          cp verified-plugin/*.jar release/craftalism-economy-${{ steps.version.outputs.version }}.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact for verification
        uses: actions/upload-artifact@v4
        with:
          name: craftalism-economy-${{ steps.version.outputs.version }}
          path: release/*.jar
          retention-days: 30
